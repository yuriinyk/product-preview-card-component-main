<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="stylesheet" href="https://fonts.google.com/specimen/Montserrat">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  </head>
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Product preview card component</title>
<link rel="stylesheet" href="images/image-product-desktop.jpg">
 
</head>
<body>
  <div class="container">
    <div class="image">
      <img src="images/image-product-desktop.jpg" alt="Perfume Bottle">
    </div>
    <div class="content">
      <p class="label">PERFUME</p>
      <h2>
        Gabrielle<br>
        Essence Eau<br>
        De Parfum
      </h2>
      <p class="description">
        A floral, solar and voluptuous <br>
        interpretation composed by<br>
        Olivier Polge,Perfumer-Creator<br>
        for the House of CHANEL.
      </p>
      <p class="price"><span class="current-price">$149.99</span> <span class="old-price">$169.99</span></p>
      <button class="add-to-cart"><i class="fas fa-shopping-cart"></i>Add to Cart

      </button>

    </div>
  </div>
</body>
</html>
